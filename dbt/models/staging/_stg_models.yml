version: 2

models:
  - name: stg_source_registry
    description: "Cleaned source registry (enabled filter, id→source_id rename)"
    columns:
      - name: source_id
        description: "UUID primary key (renamed from id)"
        tests:
          - unique
          - not_null
      - name: domain
        description: "Source domain"
        tests:
          - not_null
      - name: category
        description: "Source category enum"
        tests:
          - not_null
      - name: file_hash_sha256
        description: "SHA-256 hex of local sample"
        tests:
          - sha256_format

  - name: stg_ingestion_run
    description: "Cleaned ingestion_run + duration + insertion_pct + is_stale"
    columns:
      - name: run_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: status
        description: "RUNNING / SUCCESS / PARTIAL / FAILED"
        tests:
          - not_null
          - accepted_values:
              values: ['RUNNING', 'SUCCESS', 'PARTIAL', 'FAILED']
      - name: duration_seconds
        description: "finished_at - started_at (seconds)"
        tests:
          - duration_non_negative
      - name: insertion_pct
        description: "inserted / extracted * 100"
        tests:
          - insertion_pct_range

  - name: stg_source_document
    description: "Source documents joined with registry metadata"
    columns:
      - name: document_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: source_id
        description: "FK to source_registry"
        tests:
          - not_null
          - relationships:
              to: ref('stg_source_registry')
              field: source_id
      - name: file_hash_sha256
        description: "SHA-256 of ingested file"
        tests:
          - not_null
          - sha256_format

  - name: stg_observation
    description: "Cleaned observations (FACT only, migration 004 columns)"
    columns:
      - name: observation_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: source_id
        description: "FK to source_document"
        tests:
          - not_null
          - relationships:
              to: ref('stg_source_document')
              field: document_id
      - name: value_type
        description: "Information layer enum"
        tests:
          - accepted_values:
              values: ['FACT']

  - name: stg_observation_quality
    description: "Per-observation quality scoring (0-1 composite)"
    columns:
      - name: observation_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: quality_score
        description: "5-factor composite score (0-1)"
        tests:
          - quality_score_range

  - name: stg_person
    description: "Person passthrough (S2.1-full, docs/36 §2.1; id→person_id rename)"
    columns:
      - name: person_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: canonical_name
        tests:
          - not_null

  - name: stg_person_name_alias
    description: "Person name aliases (docs/36 §2.2; 同名异人不直接合并)"
    columns:
      - name: alias_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: person_id
        tests:
          - not_null
      - name: alias
        tests:
          - not_null

  - name: stg_position
    description: "Position passthrough (docs/36 §2.3; rank_level = filter enum)"
    columns:
      - name: position_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null

  - name: stg_tenure
    description: "Tenure passthrough (docs/36 §2.4; overlapping tenures legal)"
    columns:
      - name: tenure_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: person_id
        tests:
          - not_null
      - name: position_id
        tests:
          - not_null
      - name: source_id
        tests:
          - not_null

  - name: stg_appointment_event
    description: "Appointment events passthrough (docs/36 §2.5; append-only)"
    columns:
      - name: event_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: tenure_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null

  - name: stg_person_source_evidence
    description: "Person source evidence passthrough (docs/36 §2.6)"
    columns:
      - name: evidence_id
        description: "UUID primary key"
        tests:
          - unique
          - not_null
      - name: person_id
        tests:
          - not_null
      - name: source_id
        tests:
          - not_null