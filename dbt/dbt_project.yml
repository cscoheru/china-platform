name: 'cegr'
version: '0.1.0'
config-version: 2
profile: 'cegr'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  cegr:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      # P1 mart (mart_province_gdp_2024) 仍 materialized='view' 在文件内联声明,
      # 沿用 knife 659 原始契约; 新增的 P2 mart (mart_province_timeseries) 用 table
      # (见文件内 config block, 2026-09-03 引入).
      +materialized: view
      +schema: mart
