# deploy/fastapi-deploy/nginx.conf — China Platform FastAPI reverse proxy (knife 664h)
#
# Per memory china-platform-fastapi-missing-on-newvps + knife 664 plan.
# 部署到 newvps: /etc/nginx/sites-enabled/china-platform-api.conf
# Reload:   sudo systemctl reload nginx
#
# 关键约束:
#   - :443 (host nginx) → 127.0.0.1:8001 (FastAPI container 宿主端口)
#   - port 8000 = portainer, 禁直接 proxy_pass
#   - 公网域名: china.3strategy.cc (per knife 664 plan)
#   - 前端 Next.js 静态 build 也走 :443 (separate location)

# upstream block: FastAPI 容器经 docker compose 暴露在 127.0.0.1:8001
upstream china_platform_api_upstream {
    server 127.0.0.1:8001;
    keepalive 32;
}

# server block: :443 TLS termination + reverse proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name china.3strategy.cc;

    # TLS certs (Let's Encrypt / 自签, 由 ops 团队提供)
    ssl_certificate     /etc/letsencrypt/live/china.3strategy.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/china.3strategy.cc/privkey.pem;

    # Security headers (per docs/24 §11 + OWASP best practices)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── API routes ─────────────────────────────────────────────────────
    # /api/* → FastAPI backend
    location /api/ {
        proxy_pass http://china_platform_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Timeouts: FastAPI queries are read-only + small payload (≤ 10s typical).
        # 30s gives headroom for slow dbt-derived endpoints, prevents hung connections.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Cache: API responses are dynamic; no caching.
        add_header Cache-Control "no-store" always;
    }

    # /health → FastAPI (no auth, monitoring endpoint)
    location = /api/health {
        proxy_pass http://china_platform_api_upstream/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # ── Frontend (Next.js static) ──────────────────────────────────────
    # / → Next.js build output (served by separate location block, typically
    # static file server or separate Node.js process). Stub for knife 667.
    location / {
        # TODO(667): serve Next.js build output. Until then, fall through to
        # FastAPI root (will 404) so this location doesn't accidentally proxy
        # to the wrong upstream.
        return 404;
    }

    # ── Logging ────────────────────────────────────────────────────────
    access_log /var/log/nginx/china.3strategy.cc.access.log;
    error_log  /var/log/nginx/china.3strategy.cc.error.log warn;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name china.3strategy.cc;
    return 301 https://$host$request_uri;
}