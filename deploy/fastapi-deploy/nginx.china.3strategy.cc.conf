# deploy/fastapi-deploy/nginx.china.3strategy.cc.conf — China Platform nginx (knife 664h deploy)
#
# 部署到 newvps: /etc/nginx/sites-enabled/china.3strategy.cc.conf (替代默认)
# Reload:   systemctl reload nginx (or `nginx -s reload`)
#
# 关键约束 (per memory china-platform-fastapi-missing-on-newvps):
#   - :443 → 127.0.0.1:8001 (FastAPI container 宿主端口, 避让 portainer 占的 8000)
#   - :443 / → 127.0.0.1:3000 (Next.js frontend)
#   - /api/* → FastAPI backend (proxy_pass upstream)
#   - /api/health → FastAPI (无 auth, monitoring)
#   - 80 → 301 redirect HTTPS
#
# 验证 (部署后):
#   curl "https://china.3strategy.cc/api/health"
#   curl "https://china.3strategy.cc/api/province-timeseries/BEIJING?year_start=2024&year_end=2024"

# Upstream: FastAPI 容器 (china-platform-api:8000 → 宿主 8001)
upstream china_platform_api_upstream {
    server 127.0.0.1:8001;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name china.3strategy.cc;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name china.3strategy.cc;

    # Cloudflare Origin cert (per existing china.3strategy.cc.conf on newvps).
    # NOTE: 部署到 newvps 时按 ops 实际证书路径调整 (本机占位).
    ssl_certificate     /etc/ssl/cloudflare/china.3strategy.cc.pem;
    ssl_certificate_key /etc/ssl/cloudflare/china.3strategy.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── FastAPI backend (knife 664) ──────────────────────────────────────
    # /api/* → :8001 (避开 portainer 占的 :8000)
    location /api/ {
        proxy_pass http://china_platform_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        add_header Cache-Control "no-store" always;
        access_log /var/log/nginx/china.3strategy.cc.api.access.log;
        error_log  /var/log/nginx/china.3strategy.cc.api.error.log warn;
    }

    # /api/health → FastAPI (no auth, monitoring endpoint)
    location = /api/health {
        proxy_pass http://china_platform_api_upstream/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # ── Frontend (Next.js) ───────────────────────────────────────────────
    # / → 127.0.0.1:3000 (Next.js dev server, 由 frontend 容器提供)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}