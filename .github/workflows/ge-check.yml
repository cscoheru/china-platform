name: ge-check

on:
  push:
    paths:
      - "ge/**"
      - ".github/workflows/ge-check.yml"
  pull_request:
    paths:
      - "ge/**"

permissions:
  contents: read

jobs:
  loadable:
    name: GE suites + checkpoints loadable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Great Expectations 0.18
        run: |
          python -m pip install --upgrade pip
          pip install "great_expectations>=0.18,<0.19" pytest pyyaml

      - name: Run ge/tests/ suite (≥19 tests per reviews/86)
        run: |
          python -m pytest ge/tests/ -v

  contract:
    name: GE checkpoint dry-run (syntax-only, no live DB)
    runs-on: ubuntu-latest
    needs: loadable
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GE + pyyaml
        run: |
          python -m pip install --upgrade pip
          pip install "great_expectations>=0.18,<0.19" pyyaml

      - name: Validate every suite JSON + checkpoint YAML structure
        run: |
          python -c "
          import json, sys, yaml
          from pathlib import Path
          ok = True
          for p in sorted(Path('ge/expectations').glob('*.json')):
              try:
                  d = json.loads(p.read_text())
                  assert d['expectation_suite_name']
                  assert d['expectations']
                  print(f'OK suite: {p.name} ({len(d[\"expectations\"])} expectations)')
              except Exception as e:
                  ok = False
                  print(f'FAIL suite: {p.name}: {e}', file=sys.stderr)
          for p in sorted(Path('ge/checkpoints').glob('*.yml')):
              try:
                  d = yaml.safe_load(p.read_text())
                  assert d['name']
                  assert d['validations']
                  print(f'OK checkpoint: {p.name} ({len(d[\"validations\"])} validations)')
              except Exception as e:
                  ok = False
                  print(f'FAIL checkpoint: {p.name}: {e}', file=sys.stderr)
          sys.exit(0 if ok else 1)
          "